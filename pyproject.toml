[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fxi-knowledge"
version = "0.1.0"
description = "Standalone knowledge base extracted from the Fxi Novel writing system"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jieba>=0.42.1,<1",
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24", "ruff>=0.15,<0.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/fxi_novel"]

# Prompts and writing-chain definitions are read by path at runtime, so the
# wheel ships them as package data under fxi_novel/_data (see project_paths.py).
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "fxi_novel/_data/prompts"
"config/writing_chains" = "fxi_novel/_data/config/writing_chains"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The service/repository facades compose mixins with explicit star imports.
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
# Re-export hubs: these names are imported for downstream `import *` consumers.
"src/fxi_novel/knowledge/repository_support.py" = ["F401"]
"src/fxi_novel/knowledge/service_support.py" = ["F401"]
"src/fxi_novel/learning/service_support.py" = ["F401"]
"src/fxi_novel/knowledge/retrieval_support.py" = ["F401"]
"src/fxi_novel/knowledge/models.py" = ["F401"]
"src/fxi_novel/knowledge/models_base.py" = ["F401"]
"src/fxi_novel/knowledge/models_graph.py" = ["F401"]
"src/fxi_novel/learning/payloads.py" = ["F401"]
"src/fxi_novel/knowledge/service_writing_methods.py" = ["F401"]
"src/fxi_novel/knowledge/repository_parse_event_evidence.py" = ["F401"]
# Tests import pytest fixtures by name and receive them as same-named arguments.
"tests/*" = ["F401", "F811", "E402"]
